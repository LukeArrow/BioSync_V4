---
# BioSync V4: Kalibrierung und Beispielalarme ausschließlich in Home Assistant.
# Als /config/packages/biosync_v4.yaml kopieren und in configuration.yaml
# unter homeassistant: packages: !include_dir_named packages einbinden.
# MQTT liefert sensor.biosync_v4_*_raw; Firmware und Bridge bleiben unverändert.
# V4 hat keine SD-, Firmware-Alarm- oder Letztes-Telegramm-Entity. Alte
# biosync_displaynode_usb_bridge_* Referenzen passen daher nicht zu diesem Paket.
# Die Sensoren unten sind aus Rohwerten abgeleitet, keine zusätzlichen Messungen.
# Biologie-/Gesundheitsindizes aus alten Paketen wären lediglich Heuristiken,
# keine gemessene biologische Aktivität; sie werden hier nicht nachgebildet.

# Kalibrierwerte unter Einstellungen → Geräte & Dienste → Helfer anpassen.
# Ohne "initial" stellt HA gespeicherte Werte nach Neustarts wieder her.
# min/max begrenzen die Eingabe der Helfer, nicht die berechneten Sensorwerte.
input_number:
  # Distanz: (Rohwert in cm + Offset in cm) * Skalierung.
  # Offset korrigiert den Nullpunkt VOR der Skalierung, Scale die Steigung.
  # Bei Scale = 1: Offset = Referenzabstand - Rohwert.
  # Für zwei Referenzen: Scale = (Ref2 - Ref1) / (Roh2 - Roh1),
  # dann Offset = Ref1 / Scale - Roh1; unterschiedliche Rohwerte erforderlich.
  # Die hier erlaubte Skalierung ist positiv (0,1 bis 10).
  biosync_v4_dist_offset:
    name: BioSync Distanz Offset
    min: -100
    max: 100
    step: 0.1
    unit_of_measurement: cm
  biosync_v4_dist_scale:
    name: BioSync Distanz Skalierung
    min: 0.1
    max: 10
    step: 0.01
  # Temperatur: gleiche Offset-/Scale-Formel wie Distanz, hier in °C.
  # Mit einem Referenzthermometer vergleichen; bei Scale = 1 nur Offset ändern.
  biosync_v4_tmp_offset:
    name: BioSync Temperatur Offset
    min: -20
    max: 20
    step: 0.1
    unit_of_measurement: "°C"
  biosync_v4_tmp_scale:
    name: BioSync Temperatur Skalierung
    min: 0.1
    max: 10
    step: 0.01
  # Trübung: drei Paare aus gemessenem ADC-Wert x und Referenztrübung y in NTU.
  # Mit Referenzlösungen bestimmen; nach ADC sortieren: x1 < x2 < x3.
  # NTU darf dabei steigen oder fallen. Gleiche x-Werte sind nicht zulässig.
  # Eingabebereiche: ADC 0–1023, Referenztrübung 0–10000 NTU.
  biosync_v4_tur_x1:
    name: BioSync Trübung ADC-Punkt 1
    min: 0
    max: 1023
    step: 1
    unit_of_measurement: ADC
  biosync_v4_tur_y1:
    name: BioSync Trübung NTU-Punkt 1
    min: 0
    max: 10000
    step: 1
    unit_of_measurement: NTU
  biosync_v4_tur_x2:
    name: BioSync Trübung ADC-Punkt 2
    min: 0
    max: 1023
    step: 1
    unit_of_measurement: ADC
  biosync_v4_tur_y2:
    name: BioSync Trübung NTU-Punkt 2
    min: 0
    max: 10000
    step: 1
    unit_of_measurement: NTU
  biosync_v4_tur_x3:
    name: BioSync Trübung ADC-Punkt 3
    min: 0
    max: 1023
    step: 1
    unit_of_measurement: ADC
  biosync_v4_tur_y3:
    name: BioSync Trübung NTU-Punkt 3
    min: 0
    max: 10000
    step: 1
    unit_of_measurement: NTU
  # TDS: a*x³ + b*x² + c*x + d, x ist der rohe ADC-Wert (keine Spannung).
  # Koeffizienten mit passenden Referenzlösungen bestimmen; eine Messung allein
  # reicht nicht aus, um vier Koeffizienten eindeutig festzulegen.
  # Das Polynom beschreibt TDS bei Messtemperatur; unten wird auf 25 °C bezogen.
  biosync_v4_tds_a:
    name: BioSync TDS Koeffizient A
    min: -1
    max: 1
    step: 0.0001
  biosync_v4_tds_b:
    name: BioSync TDS Koeffizient B
    min: -100
    max: 100
    step: 0.001
  biosync_v4_tds_c:
    name: BioSync TDS Koeffizient C
    min: -10000
    max: 10000
    step: 0.01
  biosync_v4_tds_d:
    name: BioSync TDS Koeffizient D
    min: -10000
    max: 10000
    step: 0.1
    unit_of_measurement: ppm
  # Frei wählbare Betriebsschwellen für kalibrierte Werte, keine amtlichen
  # Qualitätsgrenzen oder Sensor-Plausibilitätsgrenzen. Alarm nur bei Wert > Grenze.
  # Distanz ist Sensorabstand zur Oberfläche, nicht Wasserhöhe oder Füllstand-%.
  # Größerer Abstand bedeutet bei festem Sensor normalerweise weniger Wasser.
  biosync_v4_dist_threshold:
    name: BioSync Distanz Grenzwert
    min: 0
    max: 1000
    step: 1
    unit_of_measurement: cm
  biosync_v4_tur_threshold:
    name: BioSync Trübung Grenzwert
    min: 0
    max: 10000
    step: 1
    unit_of_measurement: NTU
  biosync_v4_tds_threshold:
    name: BioSync TDS Grenzwert
    min: 0
    max: 10000
    step: 1
    unit_of_measurement: ppm

input_boolean:
  # Merker für die einmalige Initialisierung; nicht zum Kalibrieren ausschalten.
  # Ist er beim HA-Start aus, werden ALLE Kalibrier- und Grenzwerte zurückgesetzt.
  biosync_calibration_initialized:
    name: BioSync Kalibrierung initialisiert
  biosync_maintenance:
    name: BioSync Wartungsmodus
    icon: mdi:wrench
    initial: false

template:
  # Fehlende/nichtnumerische Roh- oder Helferwerte ergeben keinen Zahlenwert
  # (unknown), nicht künstlich 0. Ergebnisse werden auf zwei Stellen gerundet.
  # Die Bridge prüft Rohbereiche: Distanz 0–500 cm, Temperatur -20–60 °C,
  # Trübung/TDS 0–1023 ADC. Hier gibt es keine zusätzliche Ergebnisbegrenzung.
  - sensor:
      # Kalibrierter Abstand; daraus wird hier kein Behälterfüllstand berechnet.
      - name: BioSync Füllstand Abstand
        unique_id: biosync_v4_distance
        default_entity_id: sensor.biosync_v4_distance
        state: >-
          {% set raw = states('sensor.biosync_v4_distance_raw') %}
          {% set offset = states('input_number.biosync_v4_dist_offset') %}
          {% set scale = states('input_number.biosync_v4_dist_scale') %}
          {% if is_number(raw) and is_number(offset) and is_number(scale) %}
            {% set raw_value = raw | float %}
            {% set corrected_offset = offset | float %}
            {% set scale_factor = scale | float %}
            {{ ((raw_value + corrected_offset) * scale_factor) | round(2) }}
          {% else %}
            {{ none }}
          {% endif %}
        unit_of_measurement: cm
        device_class: distance
        state_class: measurement
      - name: BioSync Temperatur
        unique_id: biosync_v4_temperature
        default_entity_id: sensor.biosync_v4_temperature
        state: >-
          {% set raw = states('sensor.biosync_v4_temperature_raw') %}
          {% set offset = states('input_number.biosync_v4_tmp_offset') %}
          {% set scale = states('input_number.biosync_v4_tmp_scale') %}
          {% if is_number(raw) and is_number(offset) and is_number(scale) %}
            {% set raw_value = raw | float %}
            {% set corrected_offset = offset | float %}
            {% set scale_factor = scale | float %}
            {{ ((raw_value + corrected_offset) * scale_factor) | round(2) }}
          {% else %}
            {{ none }}
          {% endif %}
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
      # Stückweise linear: y = yi + (x - xi) * (yj - yi) / (xj - xi).
      # Bis einschließlich x2 gilt Paar 1/2, darüber Paar 2/3.
      # Außerhalb x1–x3 wird extrapoliert, NICHT auf den Randwert begrenzt.
      # Dadurch können auch negative NTU entstehen; nur im kalibrierten Bereich
      # sinnvoll auswerten. Ungültige Punktreihenfolge ergibt unknown.
      - name: BioSync Trübung
        unique_id: biosync_v4_turbidity
        default_entity_id: sensor.biosync_v4_turbidity
        state: >-
          {% set raw = states('sensor.biosync_v4_turbidity_raw') | float(none) %}
          {% set x1 = states('input_number.biosync_v4_tur_x1') | float(none) %}
          {% set y1 = states('input_number.biosync_v4_tur_y1') | float(none) %}
          {% set x2 = states('input_number.biosync_v4_tur_x2') | float(none) %}
          {% set y2 = states('input_number.biosync_v4_tur_y2') | float(none) %}
          {% set x3 = states('input_number.biosync_v4_tur_x3') | float(none) %}
          {% set y3 = states('input_number.biosync_v4_tur_y3') | float(none) %}
          {% if raw is not none and x1 is not none and y1 is not none
                and x2 is not none and y2 is not none
                and x3 is not none and y3 is not none and x1 < x2 < x3 %}
            {% if raw <= x2 %}
              {{ (y1 + (raw - x1) * (y2 - y1) / (x2 - x1)) | round(2) }}
            {% else %}
              {{ (y2 + (raw - x2) * (y3 - y2) / (x3 - x2)) | round(2) }}
            {% endif %}
          {% else %}
            {{ none }}
          {% endif %}
        unit_of_measurement: NTU
        state_class: measurement
      # TDS_25 = (a*x³ + b*x² + c*x + d) / (1 + 0,02 * (T - 25)).
      # T ist die oben kalibrierte Temperatur. 0,02 entspricht einer angenommenen
      # Änderung von 2 % pro °C: eine Näherung, die nicht für jedes Wasser passt.
      # Bei T = 25 °C ist der Faktor 1; bei Faktor <= 0 keine Berechnung.
      # Keine Begrenzung auf 0 ppm: auch negative Polynomwerte bleiben sichtbar.
      - name: BioSync TDS
        unique_id: biosync_v4_tds
        default_entity_id: sensor.biosync_v4_tds
        state: >-
          {% set raw = states('sensor.biosync_v4_tds_raw') %}
          {% set temperature = states('sensor.biosync_v4_temperature') %}
          {% set a = states('input_number.biosync_v4_tds_a') %}
          {% set b = states('input_number.biosync_v4_tds_b') %}
          {% set c = states('input_number.biosync_v4_tds_c') %}
          {% set d = states('input_number.biosync_v4_tds_d') %}
          {% if is_number(raw) and is_number(temperature) and is_number(a)
                and is_number(b) and is_number(c) and is_number(d) %}
            {% set factor = 1 + 0.02 * (temperature | float - 25) %}
            {% if factor > 0 %}
              {% set raw_value = raw | float %}
              {% set a_value = a | float %}
              {% set b_value = b | float %}
              {% set c_value = c | float %}
              {% set d_value = d | float %}
              {% set polynomial = ((a_value * raw_value + b_value)
                  * raw_value + c_value) * raw_value + d_value %}
              {{ (polynomial / factor) | round(2) }}
            {% else %}
              {{ none }}
            {% endif %}
          {% else %}
            {{ none }}
          {% endif %}
        unit_of_measurement: ppm
        state_class: measurement

automation:
  # Nur beim HA-Start und ausgeschaltetem Initialisierungsmerker:
  # Distanz/Temperatur unverändert (Offset 0, Scale 1);
  # Trübung (0/0, 512/500, 1023/1000) und TDS 2,34*ADC - 622.
  # Diese Startwerte sind BEISPIELE, keine geprüfte Sensorkalibrierung.
  # Startgrenzen: Abstand 200 cm, Trübung 1000 NTU, TDS 1000 ppm.
  # Erst danach Merker einschalten, damit weitere Starts Anpassungen erhalten.
  - id: biosync_initialize_calibration_helpers
    alias: BioSync – Kalibrierhelfer initialisieren
    mode: single
    trigger:
      - platform: homeassistant
        event: start
    condition:
      - condition: state
        entity_id: input_boolean.biosync_calibration_initialized
        state: "off"
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.biosync_v4_dist_offset
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.biosync_v4_dist_scale
        data:
          value: 1
      - service: input_number.set_value
        target:
          entity_id: input_number.biosync_v4_tmp_offset
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.biosync_v4_tmp_scale
        data:
          value: 1
      - service: input_number.set_value
        target:
          entity_id: input_number.biosync_v4_tur_x1
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.biosync_v4_tur_y1
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.biosync_v4_tur_x2
        data:
          value: 512
      - service: input_number.set_value
        target:
          entity_id: input_number.biosync_v4_tur_y2
        data:
          value: 500
      - service: input_number.set_value
        target:
          entity_id: input_number.biosync_v4_tur_x3
        data:
          value: 1023
      - service: input_number.set_value
        target:
          entity_id: input_number.biosync_v4_tur_y3
        data:
          value: 1000
      - service: input_number.set_value
        target:
          entity_id: input_number.biosync_v4_tds_a
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.biosync_v4_tds_b
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.biosync_v4_tds_c
        data:
          value: 2.34
      - service: input_number.set_value
        target:
          entity_id: input_number.biosync_v4_tds_d
        data:
          value: -622
      - service: input_number.set_value
        target:
          entity_id: input_number.biosync_v4_dist_threshold
        data:
          value: 200
      - service: input_number.set_value
        target:
          entity_id: input_number.biosync_v4_tur_threshold
        data:
          value: 1000
      - service: input_number.set_value
        target:
          entity_id: input_number.biosync_v4_tds_threshold
        data:
          value: 1000
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.biosync_calibration_initialized

  # Lokaler HA-Wartungshelfer, kein Firmware-Wartungsmodus.
  # ACHTUNG: recorder.disable pausiert die History GLOBAL, nicht nur BioSync.
  # Ausschalten aktiviert den Recorder wieder; MQTT-Messwerte laufen weiter.
  # Wartung startet wegen initial: false nach jedem HA-Neustart ausgeschaltet.
  - id: biosync_recorder_pause_for_maintenance
    alias: BioSync – Recorder bei Wartung pausieren
    mode: restart
    trigger:
      - platform: state
        entity_id: input_boolean.biosync_maintenance
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.biosync_maintenance
                state: "on"
            sequence:
              - service: recorder.disable
        default:
          - service: recorder.enable

  # Beispielalarme: prüfen bei Sensorzustandsänderung oder Wartungswechsel.
  # Eine reine Grenzwertänderung ist kein Trigger. Während Wartung sowie bei
  # unknown/unavailable werden keine neuen Meldungen erzeugt.
  # Persistente Meldungen mit fester ID werden aktualisiert, aber bei Rückkehr
  # unter den Grenzwert NICHT automatisch gelöscht. Keine Aktorsteuerung.
  - id: biosync_tds_alarm
    alias: BioSync – TDS-Grenzwert
    mode: single
    trigger:
      - platform: state
        entity_id:
          - sensor.biosync_v4_tds
          - input_boolean.biosync_maintenance
    condition:
      - condition: state
        entity_id: input_boolean.biosync_maintenance
        state: "off"
      - condition: template
        value_template: >-
          {{ states('sensor.biosync_v4_tds') not in
             ['unknown', 'unavailable'] and
             states('input_number.biosync_v4_tds_threshold') not in
             ['unknown', 'unavailable'] and
             states('sensor.biosync_v4_tds') | float(0) >
             states('input_number.biosync_v4_tds_threshold') | float(0) }}
    action:
      - service: persistent_notification.create
        data:
          notification_id: biosync_tds_alarm
          title: BioSync – TDS zu hoch
          message: >
            TDS {{ states('sensor.biosync_v4_tds') }} ppm überschreitet den
            konfigurierten Grenzwert.

  # Vergleicht kalibrierte NTU, nicht den ADC-Rohwert.
  - id: biosync_turbidity_alarm
    alias: BioSync – Trübungsgrenzwert
    mode: single
    trigger:
      - platform: state
        entity_id:
          - sensor.biosync_v4_turbidity
          - input_boolean.biosync_maintenance
    condition:
      - condition: state
        entity_id: input_boolean.biosync_maintenance
        state: "off"
      - condition: template
        value_template: >-
          {{ states('sensor.biosync_v4_turbidity') not in
             ['unknown', 'unavailable'] and
             states('input_number.biosync_v4_tur_threshold') not in
             ['unknown', 'unavailable'] and
             states('sensor.biosync_v4_turbidity') | float(0) >
             states('input_number.biosync_v4_tur_threshold') | float(0) }}
    action:
      - service: persistent_notification.create
        data:
          notification_id: biosync_turbidity_alarm
          title: BioSync – Trübung zu hoch
          message: >
            Trübung {{ states('sensor.biosync_v4_turbidity') }} NTU
            überschreitet den konfigurierten Grenzwert.

  # Vergleicht den kalibrierten Abstand in cm, nicht eine Füllstand-Prozentzahl.
  - id: biosync_distance_alarm
    alias: BioSync – Füllstand-Grenzwert
    mode: single
    trigger:
      - platform: state
        entity_id:
          - sensor.biosync_v4_distance
          - input_boolean.biosync_maintenance
    condition:
      - condition: state
        entity_id: input_boolean.biosync_maintenance
        state: "off"
      - condition: template
        value_template: >-
          {{ states('sensor.biosync_v4_distance') not in
             ['unknown', 'unavailable'] and
             states('input_number.biosync_v4_dist_threshold') not in
             ['unknown', 'unavailable'] and
             states('sensor.biosync_v4_distance') | float(0) >
             states('input_number.biosync_v4_dist_threshold') | float(0) }}
    action:
      - service: persistent_notification.create
        data:
          notification_id: biosync_distance_alarm
          title: BioSync – Füllstand-Grenzwert
          message: >
            Abstand {{ states('sensor.biosync_v4_distance') }} cm
            überschreitet den konfigurierten Grenzwert.
