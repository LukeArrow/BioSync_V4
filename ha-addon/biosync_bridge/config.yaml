name: BioSync V4 Bridge
version: "1.0.0"
slug: biosync_bridge
description: USB-/MQTT-Brücke zwischen BioSync DisplayNode (Mega) und Home Assistant
url: https://github.com/LukeArrow/BioSync_V4
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
init: false
host_network: false
uart: true
usb: true
udev: true
services:
  - mqtt:need
options:
  serial_device: /dev/ttyACM0
  baud: 115200
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  mqtt_prefix: biosync_v4
  log_level: INFO
schema:
  serial_device: str
  baud: int(1,)
  mqtt_host: str?
  mqtt_port: port
  mqtt_user: str?
  mqtt_password: password?
  mqtt_prefix: str
  log_level: list(DEBUG|INFO|WARNING|ERROR)
