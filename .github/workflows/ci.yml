name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten installieren
        run: python -m pip install -r ha-bridge/requirements.txt -r homeassistant/requirements-test.txt ruff==0.16.10
      - name: Lint und Formatierung prüfen
        run: |
          ruff check ha-bridge/
          ruff format --check ha-bridge/
      - name: Tests ausführen
        run: PYTHONPATH=ha-bridge python -m unittest discover -s ha-bridge/tests -v
